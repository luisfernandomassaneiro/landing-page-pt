<!--
  Social proof: faixa de logos de clientes
  Uso: quando tem 5-8 logos reconhecíveis. Grayscale para não competir com o hero.
-->
<section class="py-12 md:py-16 border-y border-slate-200 bg-slate-50" aria-label="Clientes">
  <div class="max-w-6xl mx-auto px-6">
    <p class="text-center text-sm font-medium text-slate-500 uppercase tracking-wider mb-8">
      {{HEADER}} <!-- Ex: "Empresas que confiam em nós" -->
    </p>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-8 items-center justify-items-center opacity-70">
      <img src="{{LOGO_1}}" alt="{{LOGO_1_ALT}}" height="32" class="h-8 w-auto grayscale">
      <img src="{{LOGO_2}}" alt="{{LOGO_2_ALT}}" height="32" class="h-8 w-auto grayscale">
      <img src="{{LOGO_3}}" alt="{{LOGO_3_ALT}}" height="32" class="h-8 w-auto grayscale">
      <img src="{{LOGO_4}}" alt="{{LOGO_4_ALT}}" height="32" class="h-8 w-auto grayscale">
      <img src="{{LOGO_5}}" alt="{{LOGO_5_ALT}}" height="32" class="h-8 w-auto grayscale">
      <img src="{{LOGO_6}}" alt="{{LOGO_6_ALT}}" height="32" class="h-8 w-auto grayscale">
    </div>
  </div>
</section>
