<!--
  Testimonials: quote única em destaque
  Uso: quando tem 1 depoimento excepcional (cliente famoso, resultado quantificado).
-->
<section class="py-20 md:py-28" aria-label="Depoimento">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <svg class="w-12 h-12 text-slate-300 mx-auto mb-8" fill="currentColor" viewBox="0 0 24 24">
      <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/>
    </svg>

    <blockquote class="text-2xl md:text-3xl font-medium text-slate-900 leading-snug">
      "{{QUOTE}}"
    </blockquote>

    <div class="mt-10 flex items-center justify-center gap-4">
      <img src="{{AVATAR}}" width="56" height="56" alt="{{NAME}}" class="w-14 h-14 rounded-full ring-2 ring-slate-200">
      <div class="text-left">
        <div class="font-semibold text-slate-900">{{NAME}}</div>
        <div class="text-slate-600 text-sm">{{ROLE}} · {{COMPANY}}</div>
      </div>
    </div>
  </div>
</section>
