<!--
  Features: grid 3 colunas x 2 linhas (6 cards com ícone)
  Uso: quando tem 4-6 features/benefícios equivalentes.
  Lembre: benefício, não feature. Ver copywriting-ptbr.md.
-->
<section class="py-16 md:py-24" aria-labelledby="features-title">
  <div class="max-w-6xl mx-auto px-6">

    <div class="max-w-3xl mx-auto text-center mb-16">
      <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">{{EYEBROW}}</p>
      <h2 id="features-title" class="mt-4 text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">
        {{TITLE}}
      </h2>
      <p class="mt-4 text-lg text-slate-600">{{SUBTITLE}}</p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
      <!-- Feature 1 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <!-- Ícone: substituir por SVG real (Heroicons, Lucide) -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_1_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_1_DESC}}</p>
      </div>

      <!-- Feature 2 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_2_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_2_DESC}}</p>
      </div>

      <!-- Feature 3 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_3_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_3_DESC}}</p>
      </div>

      <!-- Feature 4 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_4_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_4_DESC}}</p>
      </div>

      <!-- Feature 5 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_5_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_5_DESC}}</p>
      </div>

      <!-- Feature 6 -->
      <div class="p-6 rounded-2xl border border-slate-200 hover:border-slate-300 transition">
        <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">{{FEATURE_6_TITLE}}</h3>
        <p class="mt-2 text-slate-600 leading-relaxed">{{FEATURE_6_DESC}}</p>
      </div>
    </div>

  </div>
</section>
