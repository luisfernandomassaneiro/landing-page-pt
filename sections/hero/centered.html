<!--
  Hero: Centered (texto centralizado, imagem abaixo ou omitida)
  Uso: Infoproduto, curso, produto minimalista, lançamento.
-->
<section class="relative overflow-hidden" aria-labelledby="hero-title">
  <div class="max-w-4xl mx-auto px-6 pt-20 pb-16 md:pt-28 md:pb-20 text-center">

    <p class="inline-flex items-center gap-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-full px-3 py-1 mb-6">
      {{PILL_TEXT}}
    </p>

    <h1 id="hero-title" class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight text-slate-900 leading-[1.05]">
      {{HEADLINE}}
    </h1>

    <p class="mt-6 text-lg md:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
      {{SUBHEAD}}
    </p>

    <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
      <a
        href="{{CTA_PRIMARY_HREF}}"
        class="inline-flex items-center justify-center px-8 py-4 rounded-lg bg-slate-900 text-white font-semibold text-lg hover:bg-slate-800 transition shadow-lg shadow-slate-900/10"
      >
        {{CTA_PRIMARY}}
      </a>
    </div>

    <p class="mt-4 text-sm text-slate-500">
      {{MICRO_PROOF}}
    </p>

    <!-- Prova visual opcional abaixo do CTA -->
    <div class="mt-16 md:mt-20">
      <img
        src="{{HERO_IMAGE}}"
        width="1200"
        height="700"
        alt="{{HERO_ALT}}"
        fetchpriority="high"
        class="rounded-2xl shadow-2xl ring-1 ring-slate-900/5 mx-auto"
      >
    </div>

  </div>
</section>
