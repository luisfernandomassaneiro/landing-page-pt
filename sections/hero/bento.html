<!--
  Hero: Bento grid (texto principal + múltiplos cards visuais)
  Uso: Produto com múltiplas features visuais, tech moderno tipo Linear/Vercel.
-->
<section class="relative overflow-hidden" aria-labelledby="hero-title">
  <div class="max-w-6xl mx-auto px-6 pt-16 pb-20 md:pt-24">

    <div class="text-center max-w-3xl mx-auto mb-12">
      <h1 id="hero-title" class="text-4xl md:text-6xl font-bold tracking-tight text-slate-900 leading-[1.05]">
        {{HEADLINE}}
      </h1>
      <p class="mt-6 text-lg md:text-xl text-slate-600 leading-relaxed">
        {{SUBHEAD}}
      </p>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="{{CTA_PRIMARY_HREF}}" class="inline-flex items-center justify-center px-6 py-3.5 rounded-lg bg-slate-900 text-white font-medium hover:bg-slate-800 transition">
          {{CTA_PRIMARY}}
        </a>
      </div>
    </div>

    <div class="grid grid-cols-6 gap-4 md:gap-6">
      <div class="col-span-6 md:col-span-4 rounded-2xl bg-slate-50 p-6 md:p-8 border border-slate-200">
        <h3 class="text-xl font-semibold text-slate-900">{{BENTO_1_TITLE}}</h3>
        <p class="mt-2 text-slate-600">{{BENTO_1_DESC}}</p>
        <img src="{{BENTO_1_IMG}}" width="800" height="400" alt="{{BENTO_1_ALT}}" class="mt-6 rounded-lg w-full">
      </div>

      <div class="col-span-6 md:col-span-2 rounded-2xl bg-slate-900 text-white p-6 md:p-8">
        <h3 class="text-xl font-semibold">{{BENTO_2_TITLE}}</h3>
        <p class="mt-2 text-slate-300">{{BENTO_2_DESC}}</p>
      </div>

      <div class="col-span-6 md:col-span-2 rounded-2xl bg-slate-50 p-6 md:p-8 border border-slate-200">
        <h3 class="text-xl font-semibold text-slate-900">{{BENTO_3_TITLE}}</h3>
        <p class="mt-2 text-slate-600">{{BENTO_3_DESC}}</p>
      </div>

      <div class="col-span-6 md:col-span-4 rounded-2xl bg-slate-50 p-6 md:p-8 border border-slate-200">
        <h3 class="text-xl font-semibold text-slate-900">{{BENTO_4_TITLE}}</h3>
        <p class="mt-2 text-slate-600">{{BENTO_4_DESC}}</p>
        <img src="{{BENTO_4_IMG}}" width="800" height="400" alt="{{BENTO_4_ALT}}" class="mt-6 rounded-lg w-full">
      </div>
    </div>

  </div>
</section>
